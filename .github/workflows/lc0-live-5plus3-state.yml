name: Lc0 5plus3 live state

on:
  push:
    branches:
      - lc0-live-5plus3
    paths-ignore:
      - 'live/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained network artifact
        uses: actions/download-artifact@v4
        with:
          name: lc0-16x2-human-official-training
          path: /tmp/trained
          github-token: ${{ github.token }}
          repository: TanTzeHerng/chess-amateur
          run-id: 36346588532

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build meson libopenblas-dev zlib1g-dev
          python3 -m pip install --disable-pip-version-check chess

      - name: Build official Lc0 0.32.1
        run: |
          git clone --depth 1 --branch release/0.32 https://github.com/LeelaChessZero/lc0.git /tmp/lc0
          cd /tmp/lc0
          ./build.sh

      - name: Locate weights
        run: |
          W="$(find /tmp/trained -type f -name 'human-16x2-official.pb.gz' | head -1)"
          test -s "$W"
          cp "$W" /tmp/human-16x2-official.pb.gz

      - name: Play 5+3 game and publish every move
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/play_live.py <<'PY'
          import os
          import subprocess
          import time
          import chess
          import chess.pgn

          LC0 = "/tmp/lc0/build/release/lc0"
          WEIGHTS = "/tmp/human-16x2-official.pb.gz"
          MAX_PLIES = 300

          p = subprocess.Popen(
              [LC0],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )

          def send(s):
              p.stdin.write(s + "\n")
              p.stdin.flush()

          def wait_for(token, limit=10000):
              for _ in range(limit):
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Lc0 exited before " + token)
                  if token in line:
                      return
              raise RuntimeError("Timeout waiting for " + token)

          send("uci")
          wait_for("uciok")
          send("setoption name Backend value blas")
          send("setoption name WeightsFile value " + WEIGHTS)
          send("setoption name Threads value 2")
          send("setoption name MinibatchSize value 8")
          send("isready")
          wait_for("readyok")

          board = chess.Board()
          white_ms = 300000
          black_ms = 300000
          inc_ms = 3000

          def publish(last_move=None, last_uci=None, elapsed_ms=0, info=""):
              sans = []
              b = chess.Board()
              for m in board.move_stack:
                  sans.append(b.san(m))
                  b.push(m)
              tmp = "/tmp/live_state.txt"
              side = "White" if board.turn else "Black"
              result = board.result(claim_draw=True) if board.is_game_over(claim_draw=True) else "*"
              with open(tmp, "w") as f:
                  f.write("# Lc0 5+3 live self-play\n\n")
                  f.write(f"Move count: {len(board.move_stack)}\n")
                  f.write(f"Side to move: {side}\n")
                  f.write(f"White clock: {white_ms/1000:.3f}s\n")
                  f.write(f"Black clock: {black_ms/1000:.3f}s\n")
                  f.write(f"Last move: {last_move or '-'}\n")
                  f.write(f"Last UCI: {last_uci or '-'}\n")
                  f.write(f"Last search time: {elapsed_ms/1000:.3f}s\n")
                  if info:
                      f.write(f"Search info: {info}\n")
                  f.write(f"Result: {result}\n")
                  f.write(f"FEN: {board.fen()}\n\n")
                  f.write("## Moves\n\n")
                  for i in range(0, len(sans), 2):
                      f.write(f"{i//2+1}. {sans[i]}")
                      if i + 1 < len(sans):
                          f.write(f" {sans[i+1]}")
                      f.write(" ")
                  f.write("\n")
              os.makedirs("live", exist_ok=True)
              os.replace(tmp, "live/5plus3_state.txt")
              subprocess.run(["git","config","user.name","github-actions[bot]"], check=True)
              subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git","add","live/5plus3_state.txt"], check=True)
              subprocess.run(["git","commit","-m",f"live 5+3 move {len(board.move_stack)}"], check=True)
              subprocess.run(["git","push","origin","HEAD:lc0-live-5plus3"], check=True)

          publish()

          while not board.is_game_over(claim_draw=True) and len(board.move_stack) < MAX_PLIES:
              stm = board.turn
              before = time.monotonic()
              uci_moves = " ".join(m.uci() for m in board.move_stack)
              cmd = "position startpos"
              if uci_moves:
                  cmd += " moves " + uci_moves
              send(cmd)
              send(f"go wtime {white_ms} btime {black_ms} winc {inc_ms} binc {inc_ms}")

              best = None
              infos = []
              while True:
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Lc0 exited during game")
                  if line.startswith("info "):
                      infos.append(line.rstrip())
                  if line.startswith("bestmove "):
                      best = line.split()[1]
                      break

              elapsed = int((time.monotonic() - before) * 1000)
              if stm:
                  white_ms = max(0, white_ms - elapsed + inc_ms)
              else:
                  black_ms = max(0, black_ms - elapsed + inc_ms)

              move = chess.Move.from_uci(best)
              if move not in board.legal_moves:
                  raise RuntimeError("Illegal Lc0 move: " + best)
              san = board.san(move)
              board.push(move)

              publish(
                  last_move=san,
                  last_uci=best,
                  elapsed_ms=elapsed,
                  info=infos[-1] if infos else "",
              )

              if (stm and white_ms <= 0) or ((not stm) and black_ms <= 0):
                  break

          send("quit")
          p.wait(timeout=10)

          game = chess.pgn.Game()
          game.headers["Event"] = "Lc0 5+3 Self-Play"
          game.headers["Site"] = "GitHub Actions"
          game.headers["Date"] = "2026.09.28"
          game.headers["White"] = "human-16x2-official-search"
          game.headers["Black"] = "human-16x2-official-search"
          game.headers["TimeControl"] = "300+3"
          game.headers["Result"] = board.result(claim_draw=True) if board.is_game_over(claim_draw=True) else "*"
          node = game
          for m in board.move_stack:
              node = node.add_variation(m)

          with open("/tmp/lc0-5plus3-selfplay.pgn", "w") as f:
              print(game, file=f, end="\n")

          subprocess.run(["cp","/tmp/lc0-5plus3-selfplay.pgn","live/5plus3_final.pgn"], check=True)
          subprocess.run(["git","add","live/5plus3_final.pgn"], check=True)
          subprocess.run(["git","commit","-m","live 5+3 final PGN"], check=True)
          subprocess.run(["git","push","origin","HEAD:lc0-live-5plus3"], check=True)

          print(open("/tmp/lc0-5plus3-selfplay.pgn").read())
          PY
          python3 /tmp/play_live.py

      - name: Upload final PGN
        uses: actions/upload-artifact@v4
        with:
          name: lc0-5plus3-live-final
          path: /tmp/lc0-5plus3-selfplay.pgn

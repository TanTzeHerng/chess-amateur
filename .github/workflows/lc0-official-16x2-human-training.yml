name: LC0 official 16x2 human training

concurrency:
  group: lc0-official-16x2-human-training
  cancel-in-progress: true

on:
  push:
    branches:
      - lc0-official-16x2-human-training
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake             libboost-all-dev             libopenblas-dev             protobuf-compiler             zlib1g-dev             pkg-config             ninja-build             meson             unzip             curl

      - name: Set up Python 3.8 for legacy official trainer
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install legacy Lc0 trainer dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install             'numpy==1.19.5'             'tensorflow==2.5.1'             'protobuf==3.12.1'             'PyYAML==5.4.1'

      - name: Build official PGN -> Lc0 training-data converter
        run: |
          git clone --depth 1 --recursive https://github.com/DanielUranga/trainingdata-tool.git /tmp/trainingdata-tool
          cd /tmp/trainingdata-tool
          cmake -DCMAKE_BUILD_TYPE=Release .
          cmake --build . --config Release -- -j2

      - name: Download human-game corpus
        run: |
          mkdir -p /tmp/human_data
          curl -fL --retry 5 --retry-all-errors             -o /tmp/RuyLopezExchange.zip             https://www.pgnmentor.com/openings/RuyLopezExchange.zip
          unzip -o /tmp/RuyLopezExchange.zip -d /tmp/human_data
          GAMEFILE=/tmp/human_data/RuyLopezExchange.pgn
          test -s "$GAMEFILE"
          echo "PGN size: $(stat -c%s "$GAMEFILE") bytes"
          echo "Game count: $(grep -c '^\[Event ' "$GAMEFILE")"

      - name: Convert games into official Lc0 V4 training chunks
        run: |
          mkdir -p /tmp/lc0_data
          cd /tmp/lc0_data
          /tmp/trainingdata-tool/trainingdata-tool             -files-per-dir 10000             -chunks-per-file 4096             -max-games-to-convert 10000000             /tmp/human_data/RuyLopezExchange.pgn
          echo "Produced training chunks:"
          find /tmp/lc0_data -type f -name '*.gz' | wc -l
          find /tmp/lc0_data -type f -name '*.gz' -print | head -20

      - name: Fetch official Lc0 protobuf definition for the legacy trainer
        run: |
          rm -rf /tmp/lczero-training
          git clone --depth 1 https://github.com/LeelaChessZero/lczero-training.git /tmp/lczero-training
          mkdir -p /tmp/lczero-training/proto
          curl -fL --retry 5 --retry-all-errors             -o /tmp/lczero-training/proto/net.proto             https://raw.githubusercontent.com/LeelaChessZero/lczero-common/b326b154221a6eb91977bdccf11d6f89e8547875/proto/net.proto
          touch /tmp/lczero-training/proto/__init__.py
          protoc --proto_path=/tmp/lczero-training/proto             --python_out=/tmp/lczero-training/proto             /tmp/lczero-training/proto/net.proto
          test -s /tmp/lczero-training/proto/net_pb2.py
          python -m py_compile /tmp/lczero-training/proto/net_pb2.py

      - name: Configure official Lc0 legacy 16x2 trainer
        run: |
          cat > /tmp/lczero-training/tf/official_16x2.yaml <<'YAML'
          %YAML 1.2
          ---
          name: 'human-16x2-ruylopez-exchange-10k'
          gpu: all

          dataset:
            num_chunks: 100000
            allow_less_chunks: true
            train_ratio: 0.90
            input: '/tmp/lc0_data/*/'

          training:
            batch_size: 256
            num_batch_splits: 1
            test_steps: 50
            train_avg_report_steps: 50
            total_steps: 10000
            warmup_steps: 250
            shuffle_size: 65536
            lr_values:
              - 0.005
              - 0.001
            lr_boundaries:
              - 100
            policy_loss_weight: 1.0
            value_loss_weight: 1.0
            moves_left_loss_weight: 0.0
            path: '/tmp/lc0_models'
            mask_legal_moves: true
            moves_left_loss_weight: 0.0
            q_ratio: 0.0

          model:
            filters: 16
            residual_blocks: 2
            se_ratio: 2
            policy: 'convolution'
            value: 'wdl'
            moves_left: 'v1'
          ...
          YAML

      - name: Run official Lc0 training pipeline
        working-directory: /tmp/lczero-training/tf
        env:
          PYTHONPATH: /tmp/lczero-training/tf:/tmp/lczero-training
          TF_CPP_MIN_LOG_LEVEL: 1
          TF_XLA_FLAGS: "--tf_xla_cpu_global_jit --tf_xla_auto_jit=2"
          OMP_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 2
        run: |
          mkdir -p /tmp/lc0_models
          python train.py             --cfg /tmp/lczero-training/tf/official_16x2.yaml             --output /tmp/human-16x2-official.pb.gz

      - name: Build official Lc0 0.32 CPU engine
        run: |
          git clone --depth 1 --branch release/0.32 https://github.com/LeelaChessZero/lc0.git /tmp/lc0
          cd /tmp/lc0
          ./build.sh

      - name: Verify weights with official Lc0 and play self-game
        working-directory: /tmp/lc0/build/release
        env:
          OMP_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 2
        run: |
          cp /tmp/human-16x2-official.pb.gz ./human-16x2-official.pb.gz

          printf 'uci\nisready\nsetoption name Backend value blas\nsetoption name WeightsFile value %s\nisready\n'             "$(pwd)/human-16x2-official.pb.gz" | ./lc0 >/tmp/lc0_init.txt 2>&1 || true
          grep -Ei 'readyok|error|unsupported' /tmp/lc0_init.txt || true

          cat > /tmp/selfplay_script.txt <<'EOF'
          uci
          setoption name Backend value blas
          setoption name WeightsFile value /tmp/lc0/build/release/human-16x2-official.pb.gz
          setoption name Threads value 2
          setoption name MinibatchSize value 8
          isready
          position startpos
          go nodes 500
          quit
          EOF
          ./lc0 < /tmp/selfplay_script.txt > /tmp/engine_game.txt 2>&1

          cat /tmp/engine_game.txt

      - name: Produce deterministic self-play PGN
        run: |
          python -m pip install 'python-chess==1.0.1'
          cat > /tmp/play_self.py <<'PY'
          import subprocess
          import chess
          import chess.pgn

          lc0 = "/tmp/lc0/build/release/lc0"
          weights = "/tmp/human-16x2-official.pb.gz"

          p = subprocess.Popen(
              [lc0],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )

          def send(command):
              p.stdin.write(command + "\n")
              p.stdin.flush()

          def wait_for(token, limit=5000):
              for _ in range(limit):
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Lc0 exited before " + token)
                  if token in line:
                      return line.rstrip()
              raise RuntimeError("Timed out waiting for " + token)

          send("uci")
          wait_for("uciok")
          send("setoption name Backend value blas")
          send("setoption name WeightsFile value " + weights)
          send("setoption name Threads value 2")
          send("setoption name MinibatchSize value 8")
          send("isready")
          wait_for("readyok")
          send("ucinewgame")

          moves = []
          current = []
          for ply in range(120):
              position_cmd = "position startpos"
              if current:
                  position_cmd += " moves " + " ".join(current)
              send(position_cmd)
              send("go nodes 500")

              best = None
              while True:
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Lc0 exited during search")
                  if line.startswith("bestmove "):
                      best = line.split()[1]
                      break

              if best in ("0000", "(none)"):
                  break
              moves.append(best)
              current.append(best)

          send("quit")
          p.wait(timeout=10)

          board = chess.Board()
          game = chess.pgn.Game()
          game.headers["Event"] = "Lc0 self-play"
          game.headers["Site"] = "GitHub Actions"
          game.headers["White"] = "human-16x2-official"
          game.headers["Black"] = "human-16x2-official"
          game.headers["Result"] = "*"

          node = game
          for uci in moves:
              try:
                  move = chess.Move.from_uci(uci)
              except ValueError as exc:
                  raise RuntimeError(f"Bad UCI move emitted by Lc0: {uci}") from exc
              if move not in board.legal_moves:
                  raise RuntimeError(f"Illegal move emitted by Lc0: {uci} at FEN {board.fen()}")
              node = node.add_main_variation(move)
              board.push(move)

          with open("/tmp/selfplay.pgn", "w") as f:
              exporter = chess.pgn.StringExporter(headers=True, variations=False, comments=False)
              f.write(game.accept(exporter))
              f.write("\n")

          print("legal-search plies:", len(moves))
          print("final FEN:", board.fen())
          PY
          python /tmp/play_self.py
          test -s /tmp/selfplay.pgn

      - name: Upload trained network, PGN, and logs
        uses: actions/upload-artifact@v4
        with:
          name: lc0-16x2-human-official-training
          path: |
            /tmp/human-16x2-official.pb.gz
            /tmp/selfplay.pgn
            /tmp/engine_game.txt
            /tmp/lc0_init.txt
            /tmp/lc0_models/**
            /tmp/lczero-training/tf/leelalogs/**
            /tmp/lczero-training/tf/official_16x2.yaml
          if-no-files-found: warn
